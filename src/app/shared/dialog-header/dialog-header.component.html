<div mat-dialog-title class="app-dialog-header">
    <span class="app-dialog-header__title">{{ title }}</span>
    <button
        mat-icon-button
        type="button"
        aria-label="ปิด"
        class="app-dialog-header__close"
        (click)="onClose()">
        <mat-icon class="app-dialog-header__close-icon">close</mat-icon>
    </button>
</div>
